<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Piecemakers City</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#252523; --paper:#F2F0DA; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Press Start 2P", monospace;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; min-height:100dvh; overflow:hidden; user-select:none;
    touch-action:none;
  }
  .wrap{ display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:12px; padding:10px; width:100%; max-height:100dvh; }
  .screen{
    position:relative; width:min(94vw, 452px); aspect-ratio:160/144;
    background:var(--paper); border:3px solid var(--ink);
    box-shadow:0 0 0 2px var(--paper), 0 0 0 3px var(--ink); border-radius:2px;
    touch-action:none;
  }
  canvas#game{ position:absolute; inset:0; width:100%; height:100%;
    image-rendering:pixelated; image-rendering:crisp-edges; display:block; }
  .dlg{ position:absolute; left:5px; right:5px; bottom:5px; height:37%;
    background:var(--paper); color:var(--ink); border:3px solid var(--ink);
    border-radius:3px; padding:8px 9px; font-size:8px; line-height:1.75; display:none; }
  .dlg::after{ content:""; position:absolute; inset:2px; border:1px solid var(--ink); border-radius:2px; pointer-events:none;}
  .dlg.show{display:block;}
  .dlg__name{ position:absolute; top:-12px; left:6px; background:var(--ink); color:var(--paper);
    font-size:7px; padding:2px 6px; border-radius:2px; }
  .dlg__more{position:absolute; right:9px; bottom:6px; font-size:8px; animation:blink 1s steps(2) infinite;}
  .dlg a{color:var(--ink); text-decoration:underline; pointer-events:auto;}
  @keyframes blink{50%{opacity:0;}}
  .choice{ position:absolute; right:6px; top:6px; background:var(--paper);
    border:3px solid var(--ink); border-radius:2px; padding:5px 8px 5px 6px;
    font-size:8px; line-height:2.2; display:none; }
  .choice.show{display:block;}
  .choice .opt{position:relative; padding-left:11px; white-space:nowrap;}
  .choice .opt.sel::before{content:"\25B6"; position:absolute; left:0;}
  .panel{ position:absolute; inset:0; background:var(--paper); display:none; flex-direction:column; padding:7px; }
  .panel.show{display:flex;}
  .panel__bar{ display:flex; justify-content:space-between; align-items:center; font-size:8px; margin-bottom:6px; flex:0 0 auto;}
  .panel__chip{background:var(--ink); color:var(--paper); padding:3px 6px; border-radius:2px;}
  .panel__body{ flex:1 1 auto; overflow-y:auto; background:var(--paper); color:var(--ink);
    border:3px solid var(--ink); border-radius:2px; padding:9px 10px; font-size:8px; line-height:1.95; -webkit-overflow-scrolling:touch; }
  .panel__body h3{font-size:9px; margin:0 0 7px; letter-spacing:1px; text-decoration:underline;}
  .panel__body h4{font-size:8px; margin:11px 0 5px; letter-spacing:1px;}
  .panel__body ul{margin:0; padding-left:12px;}
  .panel__body li{margin-bottom:6px;}
  .panel__body li.them::marker{content:"x ";}
  .panel__body a{color:var(--ink); word-break:break-all;}
  .panel__hint{font-size:7px; text-align:center; margin-top:6px; flex:0 0 auto; opacity:.7;}
  .title{ position:absolute; inset:0; background:var(--paper); color:var(--ink);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:12px; gap:16px; }
  .title.hide{display:none;}
  .title h1{font-size:14px; margin:0; line-height:1.5; letter-spacing:1px;}
  .title .sub{font-size:7px; line-height:2; opacity:.75;}
  .title .start{font-size:9px; animation:blink 1.1s steps(2) infinite;}
  .title .border{position:absolute; inset:8px; border:2px solid var(--ink); border-radius:3px;}
  .title .border::after{content:""; position:absolute; inset:3px; border:1px solid var(--ink);}
  .legend{ font-size:7px; line-height:1.9; text-align:center; letter-spacing:.5px; }
  .legend b{font-weight:normal; opacity:.55;}
  .touch{ display:none; width:min(94vw,452px); justify-content:space-between; align-items:center; }
  .pad{ display:grid; grid-template-columns:repeat(3,34px); grid-template-rows:repeat(3,34px); gap:3px; }
  .pad button, .ab button, .startbtn{ background:transparent; border:2px solid var(--ink); color:var(--ink);
    font-family:inherit; font-size:10px; border-radius:3px; display:flex; align-items:center; justify-content:center; }
  .pad .sp{border:none;}
  .pad .u{grid-area:1/2;} .pad .l{grid-area:2/1;} .pad .r{grid-area:2/3;} .pad .d{grid-area:3/2;}
  .ab{ display:flex; gap:12px; align-items:center;}
  .ab button{ width:42px; height:42px; border-radius:50%; font-size:12px;}
  .startbtn{ padding:6px 12px; font-size:8px;}
  .touch button:active{ background:var(--ink); color:var(--paper);}
  .touch button{ touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
  .panel__body{ touch-action:pan-y; }
  /* banner mode (?banner=1): bare full-bleed canvas strip for the site marquee */
  body.banner{ display:block; overflow:hidden; }
  body.banner .wrap{ display:block; padding:0; gap:0; max-height:none; }
  body.banner .screen{ position:fixed; inset:0; width:auto; aspect-ratio:auto;
    border:none; box-shadow:none; border-radius:0; }
  body.banner .legend, body.banner .touch, body.banner .title{ display:none !important; }
  @media (hover:none),(pointer:coarse){
    .touch{display:flex;}
    .legend{display:none;}
    .wrap{ justify-content:center; gap:8px; padding:6px 6px 12px; }
    .screen{ width:min(94vw, calc((100dvh - 196px) * 1.1111)); }
    .pad{ grid-template-columns:repeat(3,40px); grid-template-rows:repeat(3,40px); }
    .ab button{ width:48px; height:48px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="screen">
    <canvas id="game" width="160" height="144"></canvas>
    <div class="dlg" id="dlg">
      <span class="dlg__name" id="dlgName">NPC</span>
      <span id="dlgText"></span>
      <span class="dlg__more" id="dlgMore">&#9660;</span>
    </div>
    <div class="choice" id="choice">
      <div class="opt sel" data-i="0">READ MORE</div>
      <div class="opt" data-i="1">CLOSE</div>
    </div>
    <div class="panel" id="panel">
      <div class="panel__bar">
        <span class="panel__chip" id="panelTitle">SECTION</span>
        <span>B &#9587; CLOSE</span>
      </div>
      <div class="panel__body" id="panelBody"></div>
      <div class="panel__hint">scroll to read &middot; press B to return</div>
    </div>
    <div class="title" id="title">
      <div class="border"></div>
      <h1>PIECEMAKERS<br>CITY</h1>
      <div class="sub">A BOUTIQUE MERCH WORLD<br>BEVERLY HILLS &middot; YUCCA VALLEY</div>
      <div class="start" id="startPrompt">PRESS START</div>
    </div>
  </div>
  <div class="legend">
    <div><b>MOVE</b> &#9664;&#9650;&#9660;&#9654; / WASD &nbsp; <b>A</b> SPACE&middot;ENTER &nbsp; <b>B</b> ESC</div>
  </div>
  <div class="touch">
    <div class="pad">
      <button class="u" data-dir="up" aria-label="up"></button>
      <button class="l" data-dir="left" aria-label="left"></button>
      <span class="sp"></span>
      <button class="r" data-dir="right" aria-label="right"></button>
      <button class="d" data-dir="down" aria-label="down"></button>
    </div>
    <button class="startbtn" id="btnStart">START</button>
    <div class="ab"><button id="btnB">B</button><button id="btnA">A</button></div>
  </div>
</div>

<script>
(function(){
"use strict";

/* ============================== CONFIG ============================== */
var TILE = 16, VIEW_W = 10, VIEW_H = 9;
var INK='#252523', PAPER='#F2F0DA';
var cvs = document.getElementById('game');
var ctx = cvs.getContext('2d');
ctx.imageSmoothingEnabled = false;

/* ============================== DITHER PATTERNS ============================== */
var PAT = {};
function makePat(w,h,pts){
  var c=document.createElement('canvas'); c.width=w; c.height=h;
  var x=c.getContext('2d'); x.fillStyle=INK;
  for(var i=0;i<pts.length;i++) x.fillRect(pts[i][0],pts[i][1],1,1);
  return ctx.createPattern(c,'repeat');
}
function buildPatterns(){
  PAT.p25=makePat(2,2,[[0,0]]);
  PAT.p50=makePat(2,2,[[0,0],[1,1]]);
  PAT.diag=makePat(4,4,[[0,3],[1,2],[2,1],[3,0]]);   /* 45-degree roof stripes */
  PAT.diag2=makePat(4,4,[[0,3],[1,2],[2,1],[3,0],[0,1],[1,0],[2,3],[3,2]]);
  PAT.vert=makePat(4,4,[[0,0],[0,1],[0,2],[0,3],[1,0],[1,1],[1,2],[1,3]]); /* awning stripes */
  PAT.horiz=makePat(4,4,[[0,1],[1,1],[2,1],[3,1]]);  /* thin horizontal banding */
  PAT.check=makePat(4,4,[[0,0],[1,0],[0,1],[1,1],[2,2],[3,2],[2,3],[3,3]]); /* 2px checker */
}

/* ============================== TILE ART (2-tone, R/B style) ============================== */
var BLOCKED = {tree:1, wall:1, wallwin:1, roofT:1, roofB:1, water:1, sign:1, shelf:1, counter:1, pc:1, deadtree:1, dark:1};
(function(){ var st=['lab','mart','gym','store','post'];
  for(var i=0;i<st.length;i++){ BLOCKED['roofT_'+st[i]]=1; BLOCKED['roofB_'+st[i]]=1;
    BLOCKED['wall_'+st[i]]=1; BLOCKED['wallwin_'+st[i]]=1; BLOCKED['emb_'+st[i]]=1; } })();
var tileset = {};
function mkTile(draw){ var c=document.createElement('canvas'); c.width=TILE; c.height=TILE; draw(c.getContext('2d')); return c; }
function R(x,a,b,w,h,col){ x.fillStyle=col; x.fillRect(a,b,w,h); }
function D(x,col,pts){ x.fillStyle=col; for(var i=0;i<pts.length;i++) x.fillRect(pts[i][0],pts[i][1],pts[i][2]||1,pts[i][3]||1); }

function buildTiles(){
  /* ground: dense uniform dash texture (the iconic R/B ground) */
  tileset.grass = mkTile(function(x){
    R(x,0,0,16,16,PAPER);
    D(x,INK,[[1,2,2,1],[6,2,2,1],[11,2,2,1],
             [3,5,2,1],[8,5,2,1],[13,5,2,1],
             [1,8,2,1],[6,8,2,1],[11,8,2,1],
             [3,11,2,1],[8,11,2,1],[13,11,2,1],
             [1,14,2,1],[6,14,2,1],[11,14,2,1]]);
  });
  tileset.path = tileset.grass;
  tileset.flower = mkTile(function(x){
    R(x,0,0,16,16,PAPER);
    D(x,INK,[[6,5,4,1],[5,6,1,4],[10,6,1,4],[6,10,4,1]]); R(x,7,7,2,2,PAPER);
    D(x,INK,[[2,12,2,1],[12,3,2,1]]);
  });
  tileset.tree = mkTile(function(x){
    R(x,0,0,16,16,PAPER);
    // chunky round canopy
    D(x,INK,[[5,1,6,1],[3,2,2,1],[11,2,2,1],[2,3,1,7],[13,3,1,7],[3,10,2,1],[11,10,2,1],[5,11,6,1]]);
    x.fillStyle=PAT.p50; x.fillRect(3,2,10,9);
    D(x,INK,[[6,4,1,1],[9,6,1,1],[5,8,1,1]]);
    R(x,7,11,2,4,INK);  // trunk
  });
  /* decrepit bare tree: skeletal branches, leaning trunk */
  tileset.deadtree = mkTile(function(x){
    R(x,0,0,16,16,PAPER);
    D(x,INK,[[7,1,2,1],[4,2,1,1],[11,2,1,1],[5,3,1,1],[7,2,1,2],[10,3,1,1],
             [2,4,2,1],[6,4,1,1],[8,4,1,2],[12,4,2,1],[4,5,2,1],[10,5,2,1],
             [7,6,2,2],[6,8,1,1],[9,8,1,1],[7,8,2,5],[6,13,1,1],[5,14,2,1],[9,13,3,1],[11,12,1,1]]);
  });
  /* pitch-black haunted ground with faint glints */
  tileset.dark = mkTile(function(x){
    R(x,0,0,16,16,INK);
    D(x,PAPER,[[3,4,1,1],[13,2,1,1],[9,7,1,1],[5,11,1,1],[12,13,1,1],[7,14,1,1]]);
  });
  tileset.water = mkTile(function(x){
    R(x,0,0,16,16,PAPER);
    x.fillStyle=PAT.diag2; x.fillRect(0,0,16,16);
    D(x,INK,[[2,4,5,1],[9,9,5,1],[4,12,5,1]]);
  });
  /* roof: diagonal stripes, outlined */
  function roof(eave){ return mkTile(function(x){
    R(x,0,0,16,16,PAPER);
    x.fillStyle=PAT.diag; x.fillRect(0,0,16,16);
    x.strokeStyle=INK; x.lineWidth=1; x.strokeRect(0.5,0.5,15,15);
    if(eave) R(x,0,13,16,3,INK);   // bottom eave shadow band
  }); }
  tileset.roofT = roof(false);
  tileset.roofB = roof(true);
  /* brick wall */
  function brick(x){
    R(x,0,0,16,16,PAPER);
    D(x,INK,[[0,3,16,1],[0,8,16,1],[0,13,16,1]]);  // mortar rows
    D(x,INK,[[5,3,1,5],[11,8,1,5],[5,13,1,3],[13,0,1,3]]); // offset seams
    x.strokeStyle=INK; x.lineWidth=1; x.strokeRect(0.5,0.5,15,15);
  }
  tileset.wall = mkTile(brick);
  tileset.wallwin = mkTile(function(x){
    brick(x);
    // framed window with diagonal shine
    R(x,3,3,10,9,INK); R(x,4,4,8,7,PAPER);
    D(x,INK,[[8,4,1,7]]);                 // mullion
    D(x,INK,[[5,5,1,1],[6,6,1,1],[7,7,1,1],[10,5,1,1],[11,6,1,1]]); // shine specks
  });
  tileset.door = mkTile(function(x){
    R(x,0,0,16,16,PAPER);
    R(x,2,0,12,16,INK); R(x,3,1,10,15,PAPER); R(x,4,2,8,13,INK);
    D(x,PAPER,[[6,4,1,1],[7,5,1,1],[8,6,1,1]]);   // diagonal shine
    R(x,9,8,2,2,PAPER);                            // knob
  });
  tileset.sign = mkTile(function(x){
    R(x,0,0,16,16,PAPER);
    R(x,2,2,12,9,INK); R(x,3,3,10,7,PAPER);
    D(x,INK,[[4,5,8,1],[4,7,6,1]]);   // "text" lines
    R(x,7,11,2,4,INK);                // post
  });
  /* interiors */
  tileset.floor = mkTile(function(x){
    R(x,0,0,16,16,PAPER);
    // small diamond lattice (Pokemon Center floor)
    D(x,INK,[[8,1,1,1],[7,2,1,1],[9,2,1,1],[6,3,1,1],[10,3,1,1],
             [5,4,1,1],[11,4,1,1],[6,5,1,1],[10,5,1,1],[7,6,1,1],[9,6,1,1],[8,7,1,1]]);
    D(x,INK,[[0,8,1,1],[1,7,1,1],[1,9,1,1],[15,8,1,1],[14,7,1,1],[14,9,1,1]]);
  });
  tileset.rug = mkTile(function(x){
    R(x,0,0,16,16,PAPER); x.strokeStyle=INK; x.strokeRect(0.5,0.5,15,15);
    R(x,2,2,12,12,INK); R(x,5,5,6,6,PAPER); R(x,7,7,2,2,INK);
  });
  tileset.shelf = mkTile(function(x){
    R(x,0,0,16,16,PAPER); x.strokeStyle=INK; x.strokeRect(0.5,0.5,15,15);
    D(x,INK,[[1,1,14,1],[1,7,14,1],[1,13,14,1]]);
    D(x,INK,[[3,3,2,3],[7,3,2,3],[11,3,2,3],[3,9,2,3],[8,9,2,3]]);
  });
  tileset.counter = mkTile(function(x){
    R(x,0,0,16,16,PAPER); x.strokeStyle=INK; x.strokeRect(0.5,0.5,15,15);
    R(x,1,1,14,4,INK);
    // little pokeball-style marks on the white band
    D(x,INK,[[3,8,4,1],[3,8,1,4],[6,8,1,4],[3,11,4,1],[5,9,1,1]]);
    D(x,INK,[[9,8,4,1],[9,8,1,4],[12,8,1,4],[9,11,4,1],[11,9,1,1]]);
  });
  tileset.pc = mkTile(function(x){
    R(x,0,0,16,16,PAPER); x.strokeStyle=INK; x.strokeRect(0.5,0.5,15,15);
    R(x,3,2,10,8,INK); R(x,4,3,8,6,PAPER); D(x,INK,[[5,4,1,1],[6,5,1,1],[7,6,1,1]]);
    R(x,6,11,4,3,INK);
  });
  tileset.mat = mkTile(function(x){
    R(x,0,0,16,16,PAPER);
    R(x,2,4,12,8,INK); R(x,4,6,8,4,PAPER); R(x,7,7,2,2,INK);
  });

  /* ---- per-building styles, each with its own vibe ---- */
  function edge(x){ x.strokeStyle=INK; x.lineWidth=1; x.strokeRect(0.5,0.5,15,15); }
  function plaque(x,icon){
    R(x,0,0,16,16,PAPER);
    R(x,1,1,14,14,INK); R(x,2,2,12,12,PAPER);
    icon(x);
  }

  /* LAB (HQ): flat parapet roof + portholes, research-lab vibe */
  tileset.roofT_lab = mkTile(function(x){
    R(x,0,0,16,16,PAPER);
    x.fillStyle=PAT.horiz; x.fillRect(0,3,16,13);
    R(x,0,0,16,3,INK);                    /* parapet cap */
    edge(x);
  });
  tileset.roofB_lab = mkTile(function(x){
    R(x,0,0,16,16,PAPER);
    x.fillStyle=PAT.horiz; x.fillRect(0,0,16,16);
    edge(x); R(x,0,13,16,3,INK);
  });
  tileset.wall_lab = mkTile(function(x){
    R(x,0,0,16,16,PAPER);
    D(x,INK,[[3,4,1,1],[9,2,1,1],[13,6,1,1],[5,10,1,1],[11,12,1,1],[2,13,1,1]]); /* stucco specks */
    edge(x);
  });
  tileset.wallwin_lab = mkTile(function(x){
    R(x,0,0,16,16,PAPER);
    /* octagonal porthole window */
    D(x,INK,[[6,2,4,1],[4,3,2,1],[10,3,2,1],[3,4,1,4],[12,4,1,4],[4,8,2,1],[10,8,2,1],[6,9,4,1]]);
    D(x,INK,[[6,4,1,1],[7,5,1,1]]);       /* shine */
    D(x,INK,[[2,13,1,1],[13,12,1,1]]);
    edge(x);
  });
  tileset.emb_lab = mkTile(function(x){ plaque(x,function(x){ /* flask */
    D(x,INK,[[6,3,4,1],[7,4,1,3],[8,4,1,3],[5,7,2,1],[9,7,2,1],[4,8,1,3],[11,8,1,3],[5,10,6,2]]);
  }); });

  /* MART (Workshop): striped awning, corner-mart vibe */
  tileset.roofT_mart = mkTile(function(x){
    R(x,0,0,16,16,PAPER);
    x.fillStyle=PAT.vert; x.fillRect(0,0,16,16);
    edge(x);
  });
  tileset.roofB_mart = mkTile(function(x){
    R(x,0,0,16,16,PAPER);
    x.fillStyle=PAT.vert; x.fillRect(0,0,16,12);
    D(x,INK,[[0,12,16,1],[0,13,3,2],[5,13,3,2],[10,13,3,2],[14,13,2,2]]); /* scalloped hem */
    edge(x);
  });
  tileset.wall_mart = mkTile(function(x){
    R(x,0,0,16,16,PAPER);
    D(x,INK,[[0,2,16,1],[0,5,16,1]]);     /* fascia bands */
    edge(x);
  });
  tileset.wallwin_mart = mkTile(function(x){
    R(x,0,0,16,16,PAPER);
    R(x,1,3,14,9,INK); R(x,2,4,12,7,PAPER);   /* wide display window */
    D(x,INK,[[8,4,1,7],[3,5,1,1],[4,6,1,1],[10,5,1,1],[11,6,1,1]]);
    edge(x);
  });
  tileset.emb_mart = mkTile(function(x){ plaque(x,function(x){ /* big M */
    D(x,INK,[[4,4,2,8],[10,4,2,8],[6,5,1,2],[9,5,1,2],[7,6,2,2]]);
  }); });

  /* GYM (Proving Grounds): battlements + stone, fortress-gym vibe */
  tileset.roofT_gym = mkTile(function(x){
    R(x,0,0,16,16,PAPER);
    x.fillStyle=PAT.p50; x.fillRect(0,4,16,12);
    R(x,0,0,16,4,INK); R(x,3,0,3,3,PAPER); R(x,10,0,3,3,PAPER); /* battlements */
    edge(x);
  });
  tileset.roofB_gym = mkTile(function(x){
    R(x,0,0,16,16,PAPER);
    x.fillStyle=PAT.p50; x.fillRect(0,0,16,16);
    edge(x); R(x,0,13,16,3,INK);
  });
  tileset.wall_gym = mkTile(function(x){
    R(x,0,0,16,16,PAPER);

function tone4(ch,i,j){
  if(ch==='K') return INK;
  if(ch==='w') return PAPER;
  if(ch==='d') return ((i+j)&1)===0?INK:PAPER;        /* dark gray ~50% */
  if(ch==='l') return (i%2===0&&j%2===0)?INK:PAPER;   /* light gray ~25% */
  return null;
}
/* Characters render 14px wide (source cols 4 & 11 dropped, re-centered),
   giving them slimmer, original proportions distinct from any stock sprite sheet. */
var SLIMW=14;
function drawFrame(px,py,grid,mirror){
  for(var j=0;j<16;j++){ var row=grid[j];
    for(var i=0;i<SLIMW;i++){
      var si=Math.round(i*15/(SLIMW-1));
      var ch = mirror?row[15-si]:row[si];
      if(ch==='.') continue;
      var col=tone4(ch,i,j); if(col===null) continue;
      ctx.fillStyle=col; ctx.fillRect(px+i+1,py+j,1,1);
    } }
}
function drawChar(px,py,dir,frame,variant){
  var set = (variant==='blonde')?SHEET.josh : (variant==='npc'?SHEET.npc : SHEET.red);
  var frames, mirror=false;
  if(dir==='up') frames=set.up;
  else if(dir==='left'){ frames=set.side; }
  else if(dir==='right'){ frames=set.side; mirror=true; }
  else frames=set.down;
  var idx=(frame===1)?1:((frame===2)?2:0); if(idx>=frames.length) idx=0;
  drawFrame(px,py,frames[idx],mirror);
}

/* ============================== MAPS ============================== */
var maps = {};
function blankMap(w,h,fill){ var g=[],b=[];
  for(var y=0;y<h;y++){ g.push([]); b.push([]); for(var x=0;x<w;x++){ g[y].push(fill); b[y].push(0);} }
  return {w:w,h:h,grid:g,block:b,warps:[],npcs:[],signs:[]}; }
function setT(m,x,y,key){ if(y<0||y>=m.h||x<0||x>=m.w) return; m.grid[y][x]=key; m.block[y][x]=BLOCKED[key]?1:0; }
function fillRectT(m,x0,y0,w,h,key){ for(var y=y0;y<y0+h;y++) for(var x=x0;x<x0+w;x++) setT(m,x,y,key); }

/* Building: 2 roof rows, window-wall row, wall row(s) w/ door. Default 4x4;
   w/h vary the footprint. Style gives each its own tiles + a plaque over the door. */
function placeBuilding(m,x,y,target,label,style,w,h,signLeft){
  w=w||4; h=h||4;
  var sfx = style ? '_'+style : '';
  fillRectT(m,x,y,w,1,'roofT'+sfx);
  fillRectT(m,x,y+1,w,1,'roofB'+sfx);
  fillRectT(m,x,y+2,w,1,'wallwin'+sfx);
  for(var r=y+3;r<y+h;r++) fillRectT(m,x,r,w,1,'wall'+sfx);
  var dx=x+((w-1)>>1), dy=y+h-1; setT(m,dx,dy,'door');
  if(style) setT(m,dx,dy-1,'emb_'+style);   /* plaque hung over the door */
  var sx=signLeft?dx-1:dx+1, sy=dy+1; setT(m,sx,sy,'sign');
  m.signs.push({x:sx,y:sy,label:label,kind:'building'});
  m.warps.push({x:dx,y:dy,to:target});
}

function buildTown(){
  var W=20,H=20, m=blankMap(W,H,'grass'); maps.town=m;
  for(var x=0;x<W;x++){ setT(m,x,0,'tree'); setT(m,x,H-1,'tree'); }
  for(var y=0;y<H;y++){ setT(m,0,y,'tree'); setT(m,W-1,y,'tree'); }
  placeBuilding(m,3,1,'about','ABOUT - PIECEMAKERS HQ','lab');
  placeBuilding(m,13,1,'whatwedo','WHAT WE DO - THE WORKSHOP','mart');
  placeBuilding(m,3,7,'why','WHY WE ARE GREAT - PROVING GROUNDS','gym',5,5);  /* big fortress gym */
  placeBuilding(m,13,7,'work','WORK - THE MERCH MART','store',6,4);           /* wide dept store */
  placeBuilding(m,3,14,'contact','CONTACT - POST OFFICE','post',4,4,true);
  // scenery in the open lower-right: pond + trees
  fillRectT(m,14,14,3,2,'water');
  setT(m,13,13,'tree'); setT(m,17,13,'tree'); setT(m,13,16,'tree'); setT(m,17,16,'tree');
  // decorative flowers/trees in open spaces
  setT(m,8,3,'flower'); setT(m,11,3,'flower'); setT(m,8,9,'tree'); setT(m,11,9,'tree');
  setT(m,8,13,'flower'); setT(m,11,13,'flower');
  // welcome sign near the gate
  setT(m,12,18,'sign'); m.signs.push({x:12,y:18,label:'WELCOME',kind:'welcome'});
  // haunted fake exit, bottom-right: dark blocked path + decrepit trees + warning sign
  setT(m,15,18,'dark'); setT(m,15,19,'dark');
  setT(m,14,18,'deadtree'); setT(m,16,18,'deadtree');
  setT(m,13,16,'deadtree'); setT(m,17,16,'deadtree');   /* corner trees go decrepit too */
  setT(m,15,17,'sign'); m.signs.push({x:15,y:17,kind:'haunted'});
  // Josh James - blonde Head of Operations, greeting in the open near spawn
  m.npcs.push({x:10,y:16,dir:'down',variant:'blonde',name:'JOSH JAMES',section:null,lines:[
    'Josh James here - Head of Operations.',
    'New in town? Let me point you around Piecemakers City.',
    'NORTH-WEST: Piecemakers HQ - our story. (ABOUT)',
    'NORTH-EAST: The Workshop - what we do.',
    'WEST: The Proving Grounds - why we beat the rest.',
    'EAST: The Merch Mart - see the work.',
    'SOUTH-WEST: The Post Office - get in touch.',
    'Walk into any building and talk to the local. I run point on all of it.'

  m.spawn={x:10,y:18,dir:'up'};
}

/* Interior room. spec varies size, furniture, NPC spot:
   {w,h, f:[[x,y,tile],...], npc:[x,y,dir], ex:exitX, spawn:{x,y,dir}} */
function buildInterior(key,npc,spec){
  spec=spec||{};
  var W=spec.w||9, H=spec.h||8, m=blankMap(W,H,'floor'); maps[key]=m;
  for(var x=0;x<W;x++){ setT(m,x,0,'wall'); }
  for(var y=0;y<H;y++){ setT(m,0,y,'wall'); setT(m,W-1,y,'wall'); }
  fillRectT(m,1,1,W-2,1,'wall');
  var f=spec.f||[[2,1,'shelf'],[6,1,'pc'],[6,2,'counter'],[4,4,'rug']];
  for(var i=0;i<f.length;i++) setT(m,f[i][0],f[i][1],f[i][2]);
  var ex=(spec.ex!=null)?spec.ex:(W>>1), ey=H-1; setT(m,ex,ey,'mat');
  m.warps.push({x:ex,y:ey,to:'town', backTo:key});
  var np=spec.npc||[W>>1,2,'down'];
  m.npcs.push({x:np[0],y:np[1],dir:np[2]||'down',name:npc.name,lines:npc.lines,section:key,variant:'npc'});
  m.spawn=spec.spawn||{x:ex,y:ey-2,dir:'up'};
}

/* ============================== STATE ============================== */
var player = { x:0,y:0,px:0,py:0,dir:'down',frame:0,moving:false,prog:0,fx:0,fy:0 };
var cur='town', camX=0, camY=0;
var mode='title';
var keys={}, held=null, turnDelay=0;
var dlg={ lines:[],i:0,full:'',shown:0,t:0,section:null };
var choiceSel=0, navLock=0;

/* ============================== INPUT ============================== */
var KEYMAP={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',W:'up',S:'down',A:'left',D:'right'};
window.addEventListener('keydown',function(e){
  var k=e.key;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].indexOf(k)>=0) e.preventDefault();
  if(mode==='title'){ if(k==='Enter'||k===' ') startGame(); return; }
  if(KEYMAP[k]){ held=KEYMAP[k]; keys[KEYMAP[k]]=1; return; }
  if(k===' '||k==='Enter'||k==='z'||k==='Z') pressA();
  if(k==='x'||k==='X'||k==='Backspace'||k==='Escape') pressB();
});
window.addEventListener('keyup',function(e){
  var d=KEYMAP[e.key];
  if(d){ keys[d]=0; held=null; var o=['up','down','left','right']; for(var i=0;i<o.length;i++){ if(keys[o[i]]) held=o[i]; } }
});
function bindHold(el,dir){
  function on(e){ e.preventDefault(); if(mode==='title'){startGame();return;} held=dir; keys[dir]=1; }
  function off(e){ e.preventDefault(); keys[dir]=0; held=null; var o=['up','down','left','right']; for(var i=0;i<o.length;i++){ if(keys[o[i]]) held=o[i]; } }
  el.addEventListener('pointerdown',on);
  el.addEventListener('pointerup',off);
  el.addEventListener('pointercancel',off);
  el.addEventListener('pointerleave',off);
}
var dpadBtns=document.querySelectorAll('.pad button[data-dir]');
for(var bi=0;bi<dpadBtns.length;bi++){ bindHold(dpadBtns[bi], dpadBtns[bi].getAttribute('data-dir')); }
function tap(id,fn){ var el=document.getElementById(id); if(!el) return;
  el.addEventListener('pointerdown',function(e){e.preventDefault();fn();}); }
tap('btnA',function(){ if(mode==='title'){startGame();return;} pressA(); });
tap('btnB',function(){ pressB(); });
tap('btnStart',function(){ if(mode==='title') startGame(); });
document.getElementById('title').addEventListener('pointerdown',function(e){ if(mode==='title'){ e.preventDefault(); startGame(); } });
document.getElementById('choice').addEventListener('click',function(e){
  var o=e.target.closest('.opt'); if(!o) return; choiceSel=parseInt(o.getAttribute('data-i'),10); confirmChoice();
});

/* ============================== ACTIONS ============================== */
function startGame(){ mode='play'; document.getElementById('title').classList.add('hide'); }
function curMap(){ return maps[cur]; }
function opp(d){ return d==='up'?'down':d==='down'?'up':d==='left'?'right':'left'; }
function pressA(){
  if(mode==='dialogue'){ advanceDialogue(); return; }
  if(mode==='choice'){ confirmChoice(); return; }
  if(mode==='panel'){ return; }
  if(mode==='play'){ interact(); }
}
function pressB(){
  if(mode==='panel'){ closePanel(); return; }
  if(mode==='choice'){ closeDialogue(); return; }
  if(mode==='dialogue'){ closeDialogue(); return; }   /* bail out of dialogue anytime */
}
function interact(){
  var m=curMap(), fx=player.x, fy=player.y;
  if(player.dir==='up') fy--; else if(player.dir==='down') fy++; else if(player.dir==='left') fx--; else fx++;
  for(var i=0;i<m.npcs.length;i++){ var n=m.npcs[i]; if(n.x===fx&&n.y===fy){ n.dir=opp(player.dir); openDialogue(n.name,n.lines,n.section); return; } }
  for(var j=0;j<m.signs.length;j++){ var s=m.signs[j]; if(s.x===fx&&s.y===fy){
    if(s.kind==='welcome') openDialogue(WELCOME.name,WELCOME.lines,null);
    else if(s.kind==='haunted') openDialogue('OMINOUS SIGN',[
      'THIS WAY TO OTHER MERCH COMPANIES, AND THEIR SHENANIGANS.',
      'The path is pitch black. Somewhere in the dark, hidden fees are howling.',
      'You decide not to go in.'],null);
    else openDialogue('SIGN',[s.label,'Step inside and talk to the local for the full story.'],null);
    return; } }
}
function openDialogue(name,lines,section){
  mode='dialogue'; dlg.lines=lines.slice(); dlg.i=0; dlg.section=section;
  document.getElementById('dlgName').innerHTML=name;
  document.getElementById('choice').classList.remove('show');
  setLine(lines[0]); document.getElementById('dlg').classList.add('show');
}
/* lines containing markup render instantly so the typewriter never splits a tag */
function setLine(html){ dlg.full=html; dlg.shown=(html.indexOf('<')>=0)?html.length:0; dlg.t=0; renderLine(); }
function renderLine(){
  document.getElementById('dlgText').innerHTML=dlg.full.substring(0,dlg.shown);
  document.getElementById('dlgMore').style.display=(dlg.shown>=dlg.full.length)?'block':'none';
}
function advanceDialogue(){
  if(dlg.shown<dlg.full.length){ dlg.shown=dlg.full.length; renderLine(); return; }
  if(dlg.i<dlg.lines.length-1){ dlg.i++; setLine(dlg.lines[dlg.i]); return; }
  if(dlg.section) openChoice(); else closeDialogue();
}
function openChoice(){ mode='choice'; choiceSel=0; renderChoice(); document.getElementById('choice').classList.add('show'); document.getElementById('dlgMore').style.display='none'; }
function renderChoice(){ var o=document.querySelectorAll('#choice .opt'); for(var i=0;i<o.length;i++) o[i].classList.toggle('sel',i===choiceSel); }
function confirmChoice(){ if(choiceSel===0) openPanel(dlg.section); else closeDialogue(); }
function closeDialogue(){ mode='play'; document.getElementById('dlg').classList.remove('show'); document.getElementById('choice').classList.remove('show'); }
function openPanel(section){ var s=SECTIONS[section]; if(!s){ closeDialogue(); return; }
  mode='panel'; document.getElementById('panelTitle').innerHTML=s.title;
  document.getElementById('panelBody').innerHTML=s.body; document.getElementById('panelBody').scrollTop=0;
  document.getElementById('choice').classList.remove('show'); document.getElementById('panel').classList.add('show'); }
function closePanel(){ mode='play'; document.getElementById('panel').classList.remove('show'); document.getElementById('dlg').classList.remove('show'); }
function tryWarp(){
  var m=curMap();
  for(var i=0;i<m.warps.length;i++){ var wp=m.warps[i];
    if(wp.x===player.x&&wp.y===player.y){
      if(wp.to==='town'){ var door=findDoorTo(maps.town,wp.backTo); cur='town';
        player.x=door?door.x:maps.town.spawn.x; player.y=door?door.y+1:maps.town.spawn.y; player.dir='down'; }
      else { var im=maps[wp.to]; cur=wp.to; player.x=im.spawn.x; player.y=im.spawn.y; player.dir='up'; }
      snapPlayer(); return true;
    } }
  return false;
}
function findDoorTo(tm,section){ for(var i=0;i<tm.warps.length;i++){ if(tm.warps[i].to===section) return {x:tm.warps[i].x,y:tm.warps[i].y}; } return null; }

/* ============================== MOVEMENT ============================== */
function snapPlayer(){ player.px=player.x*TILE; player.py=player.y*TILE; player.moving=false; player.prog=0; }
function startMove(dir){
  var m=curMap(), nx=player.x, ny=player.y;
  if(dir==='up') ny--; else if(dir==='down') ny++; else if(dir==='left') nx--; else nx++;
  player.dir=dir;
  if(nx<0||ny<0||nx>=m.w||ny>=m.h) return;
  if(m.block[ny][nx]) return;
  for(var i=0;i<m.npcs.length;i++){ if(m.npcs[i].x===nx&&m.npcs[i].y===ny) return; }
  player.fx=nx; player.fy=ny; player.moving=true; player.prog=0;
}
function updateMove(dt){
  if(mode!=='play'){ return; }
  if(!player.moving){
    if(held){
      if(player.dir!==held){ player.dir=held; turnDelay=0.09; }
      else if(turnDelay>0){ turnDelay-=dt; }
      else { startMove(held); }
    } else { turnDelay=0; player.frame=0; }
  }
  if(player.moving){
    player.prog += dt/0.15;
    if(player.prog>=1){
      player.x=player.fx; player.y=player.fy; snapPlayer();
      player.frame = player.frame===1?2:1;
      if(tryWarp()) return;
      if(held && mode==='play' && player.dir===held){ startMove(held); }
    } else {
      var sx=player.x*TILE, sy=player.y*TILE, tx=player.fx*TILE, ty=player.fy*TILE;
      player.px=sx+(tx-sx)*player.prog; player.py=sy+(ty-sy)*player.prog;
    }
  }
}

/* ============================== RENDER ============================== */
function render(){
  var m=curMap();
  camX=player.px+TILE/2-(VIEW_W*TILE)/2; camY=player.py+TILE/2-(VIEW_H*TILE)/2;
  var maxX=m.w*TILE-VIEW_W*TILE, maxY=m.h*TILE-VIEW_H*TILE;
  if(camX<0)camX=0; if(camY<0)camY=0; if(camX>maxX)camX=maxX; if(camY>maxY)camY=maxY;
  if(m.w<VIEW_W) camX=(m.w*TILE-VIEW_W*TILE)/2;
  if(m.h<VIEW_H) camY=(m.h*TILE-VIEW_H*TILE)/2;
  ctx.fillStyle=PAPER; ctx.fillRect(0,0,160,144);
  var x0=Math.floor(camX/TILE), y0=Math.floor(camY/TILE);
  for(var y=y0-1;y<=y0+VIEW_H;y++){ for(var x=x0-1;x<=x0+VIEW_W;x++){
    if(x<0||y<0||x>=m.w||y>=m.h) continue;
    var t=tileset[m.grid[y][x]]; if(t) ctx.drawImage(t, Math.round(x*TILE-camX), Math.round(y*TILE-camY));
  } }
  for(var i=0;i<m.npcs.length;i++){ var n=m.npcs[i]; drawChar(Math.round(n.x*TILE-camX),Math.round(n.y*TILE-camY),n.dir,0,n.variant); }
  drawChar(Math.round(player.px-camX),Math.round(player.py-camY),player.dir,player.frame,'player');
}

/* ============================== LOOP ============================== */
var last=0;
function loop(ts){
  var dt=(ts-last)/1000; if(dt>0.05)dt=0.05; last=ts;
  if(mode==='choice'){ var now=performance.now(); if(now>navLock && (keys.up||keys.down)){ choiceSel=(choiceSel+1)%2; renderChoice(); navLock=now+180; } }
  updateMove(dt);
  if(mode==='dialogue' && dlg.shown<dlg.full.length){ dlg.t+=dt; while(dlg.t>0.018 && dlg.shown<dlg.full.length){ dlg.shown++; dlg.t-=0.018; } renderLine(); }
  render(); requestAnimationFrame(loop);
}

/* ============================== BANNER MODE ============================== */
/* Side-scrolling marquee: the player walks right past Piecemakers City scenery.
   36 logical px tall, scaled 2x by CSS; scenery loops seamlessly. */
function startBanner(){
  document.body.classList.add('banner');
  var H=36, SCALE=2, SPEED=22;
  function fit(){
    var w=Math.max(60,Math.ceil(cvs.clientWidth/SCALE));
    cvs.width=w; cvs.height=H; ctx.imageSmoothingEnabled=false;
  }
  window.addEventListener('resize',fit);
  /* parade items laid out on a looping world strip */
  var items=[], cx=0;
  function add(kind,key,w){ items.push({kind:kind,key:key,x:cx,w:w}); cx+=w; }
  function gap(g){ cx+=g; }
  add('tile','tree',16);     gap(26);
  add('tile','flower',16);   gap(34);
  add('bldg','lab',64);      gap(46);
  add('tile','sign',16);     gap(28);
  add('tile','tree',16);     gap(40);
  add('bldg','mart',64);     gap(46);
  add('tile','flower',16);   gap(26);
  add('bldg','gym',80);      gap(52);
  add('tile','tree',16);     gap(30);
  add('bldg','store',96);    gap(50);
  add('tile','deadtree',16); gap(22);
  add('tile','deadtree',16); gap(46);
  add('bldg','post',64);     gap(40);
  add('tile','tree',16);     gap(60);
  var L=cx;
  function drawBldg(st,px,w){
    var n=w/16, dx=((n-1)>>1);
    for(var i=0;i<n;i++){
      ctx.drawImage(tileset['roofB_'+st],px+i*16,0);
      ctx.drawImage(tileset[i===dx?'door':('wall_'+st)],px+i*16,16);
    }
  }
  var s=0, wt=0, ci=0, CYC=[0,1,0,2], last=0;
  function bl(ts){
    var dt=(ts-last)/1000; if(dt>0.05)dt=0.05; last=ts;
    s=(s+SPEED*dt)%L;
    wt+=dt; if(wt>0.14){ wt=0; ci=(ci+1)%4; }
    var w=cvs.width;
    ctx.fillStyle=PAPER; ctx.fillRect(0,0,w,H);
    /* ground dashes scrolling underfoot */
    ctx.fillStyle=INK;
    for(var gx=-(Math.floor(s)%10); gx<w; gx+=10){ ctx.fillRect(gx,33,4,1); }
    /* scenery, drawn across loop seams */
    for(var r=0;r<3;r++){
      var off=r*L-s;
      for(var i=0;i<items.length;i++){
        var it=items[i], px=Math.round(it.x+off);
        if(px+it.w<0||px>w) continue;
        if(it.kind==='bldg') drawBldg(it.key,px,it.w);
        else ctx.drawImage(tileset[it.key],px,16);
      }
    }
    /* the walker */
    drawChar(Math.round(w*0.22),16,'right',CYC[ci],'player');
    requestAnimationFrame(bl);
  }
  fit();
  requestAnimationFrame(bl);
}

requestAnimationFrame(loop);
}
